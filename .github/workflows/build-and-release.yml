name: Build and Release

on:
  push:
    branches:
      - initial # Trigger on every commit to main branch
    tags:
      - "v*" # Also trigger on version tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch: # Allow manual triggering

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --coverage --watchAll=false

      - name: Build project
        run: npm run build

      - name: Create zip archive
        run: |
          cd build
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            zip -r ../fora-client-${{ github.ref_name }}.zip .
          else
            zip -r ../fora-client-${{ github.sha }}.zip .
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            fora-client-${{ github.ref_name }}.zip
            fora-client-${{ github.sha }}.zip
          name: |
            ${{ github.ref_type == 'tag' && github.ref_name || format('Build {0}', github.sha) }}
          body: |
            ${{ github.ref_type == 'tag' && format('## Fora Client {0}', github.ref_name) || format('## Build {0}', github.sha) }}

            ### What's Changed
            - Built React application
            - All tests passed
            - Production-ready build included

            ### Installation
            1. Download the appropriate zip file for your needs:
              - **Version release**: `fora-client-${{ github.ref_name }}.zip` (if this is a tagged release)
              - **Latest build**: `fora-client-${{ github.sha }}.zip` (if this is a main branch commit)
            2. Extract the contents
            3. Serve the files using any static file server

            ### Build Details
            - Node.js version: 18
            - Build date: ${{ github.event.head_commit.timestamp }}
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}
            - Trigger: ${{ github.ref_type }}
          draft: false
          prerelease: ${{ github.ref_type != 'tag' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
