name: Build and Release

on:
  push:
    tags:
      - "v*" # Trigger on version tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch: # Allow manual triggering

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --coverage --watchAll=false

      - name: Build project
        run: npm run build

      - name: Create zip archive
        run: |
          cd build
          zip -r ../fora-client-${{ github.ref_name }}.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: fora-client-${{ github.ref_name }}.zip
          name: Release ${{ github.ref_name }}
          body: |
            ## Fora Client ${{ github.ref_name }}

            ### What's Changed
            - Built React application
            - All tests passed
            - Production-ready build included

            ### Installation
            1. Download the `fora-client-${{ github.ref_name }}.zip` file
            2. Extract the contents
            3. Serve the files using any static file server

            ### Build Details
            - Node.js version: 18
            - Build date: ${{ github.event.head_commit.timestamp }}
            - Commit: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
